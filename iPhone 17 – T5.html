/* الهاتف */
function dial(){
 const m=me(),st={missed:'فائتة',rejected:'مرفوضة',ended:'منتهية',active:'جارية',ringing:'ترن',busy:'مشغول'};
 const log=D.calls.filter(c=>c.from===m.num||c.to===m.num).slice(0,10).map(c=>{const o=c.from===m.num,x=o?c.to:c.from;
  return `<div class="li" onclick="ui.dial='${x}';render()"><span style="color:${c.status==='missed'&&!o?'var(--red)':'inherit'}">${o?'↗️':'↙️'} ${nameOf(x)}</span><span class="mut">${st[c.status]||''}</span></div>`}).join('')||'<div class="li mut">لا يوجد سجل</div>';
 $('#view').innerHTML=nav('لوحة الاتصال')+`<div class="dial">${esc(ui.dial)||'&nbsp;'}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}<button class="n" onclick="key('⌫')">⌫</button><button onclick="key('0')">0</button><button class="g" onclick="key('📞')">📞</button></div><div class="grp">${log}</div>`;
}
function key(k){if(k==='⌫')ui.dial=ui.dial.slice(0,-1);else if(k==='📞')return startCall(ui.dial);else if(ui.dial.length<4)ui.dial+=k;dial()}
const busy=n=>D.calls.some(c=>(c.from===n||c.to===n)&&(c.status==='active'||(c.status==='ringing'&&Date.now()-c.ts<CFG.RING_MS)));
async function startCall(n){
 const m=me();if(n.length!==4)return toast('اكتب رقم من 4 أرقام');if(n===m.num)return toast('لا يمكنك الاتصال بنفسك');
 if(!byNum(n))return toast('الرقم غير موجود');if(busy(m.num))return toast('أنت في مكالمة');
 await db.doc('calls/c'+Date.now()+m.num).set({from:m.num,to:n,status:busy(n)?'busy':'ringing',ts:Date.now()});ui.dial='';
}
const curCall=()=>{const m=me();return D.calls.find(c=>(c.from===m.num||c.to===m.num)&&(c.status==='active'||(c.status==='ringing'&&Date.now()-c.ts<CFG.RING_MS)))};
const setCall=(id,st,x={})=>db.doc('calls/'+id).update({status:st,...x});
function overlay(){
 const o=$('#ov'),c=curCall(),m=me();if(!c){o.style.display='none';callStart=0;return}
 const out=c.from===m.num,x=out?c.to:c.from,p=byNum(x);o.style.display='flex';
 const head=`<div class="av">👤</div><div class="nm">${p?esc(p.name):x}</div><div class="mut" style="color:#cbd5e1">${x}</div>`;
 if(c.status==='ringing')o.innerHTML=head+`<div>${out?'جارِ الاتصال…':'مكالمة واردة'}</div><div class="rw">${out?`<button style="background:var(--red)" onclick="setCall('${c.id}','ended')">✕</button>`:`<button style="background:var(--red)" onclick="setCall('${c.id}','rejected')">✕</button><button style="background:var(--grn)" onclick="setCall('${c.id}','active',{at:Date.now()})">📞</button>`}</div>`;
 else{callStart=c.at||Date.now();o.innerHTML=head+`<div id="tm"></div>${CFG.VOICE_URL?`<a class="btn s" style="width:auto;text-decoration:none;display:inline-block" href="${esc(CFG.VOICE_URL)}" target="_blank" rel="noopener">🎧 افتح الروم الصوتي</a>`:''}<div class="rw"><button style="background:var(--red)" onclick="setCall('${c.id}','ended')">✕</button></div>`}
}
function tick(){
 const d=new Date();$('#clk').textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false});
 if(!uid||!me())return;
 const t=$('#tm');if(t&&callStart){const s=Math.floor((Date.now()-callStart)/1000);t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
 D.calls.filter(c=>c.status==='ringing'&&c.from===me().num&&Date.now()-c.ts>=CFG.RING_MS&&!missed[c.id]).forEach(c=>{missed[c.id]=1;setCall(c.id,'missed')});
 if($('#ov').style.display==='flex'&&!curCall())overlay();
}

async function transfer(){
 const n=$('#tn').value.trim(),a=parseInt($('#ta').value,10),m=me(),t=byNum(n);
 if(!hasBank())return toast('لا تملك رتبة البنك');if(!t)return toast('الرقم غير موجود');if(n===m.num)return toast('لا يمكن التحويل لنفسك');if(!(a>0))return toast('المبلغ غير صحيح');
 const bal=((await db.doc('banks/'+uid).get()).data()||{}).bal||0;if(bal<a)return toast('رصيدك غير كافٍ');
 const ob=((await db.doc('banks/'+t.uid).get()).data()||{}).bal||0;
 await db.doc('banks/'+uid).set({bal:bal-a});await db.doc('banks/'+t.uid).set({bal:ob+a});
 await db.doc('tx/t'+Date.now()+uid.slice(0,4)).set({from:m.num,to:n,amt:a,type:'transfer',ts:Date.now()});toast('✅ تم التحويل');

async function mint(){

 if(CFG.DAILY_MINT_LIMIT&&used+a>CFG.DAILY_MINT_LIMIT)return toast('تجاوزت الحد اليومي');
 const c=(await db.doc('banks/'+uid).get()).data()||{bal:0};await db.doc('banks/'+uid).set({bal:c.bal+a});
 await db.doc('tx/t'+Date.now()+'m').set({from:'T5',to:m.num,amt:a,type:'mint',by:m.name,ts:Date.now()});toast('✅ أُضيف '+money(a));
}
